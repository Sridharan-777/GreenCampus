{% extends 'base.html' %}
{% block title %}Log In - GreenCampus{% endblock %}

{% block content %}
<div style="max-width: 440px; margin: 40px auto;">
  <div class="card" style="box-shadow: var(--shadow-lg);">
    <div style="text-align: center; margin-bottom: 28px;">
      <div class="brand-icon" style="margin: 0 auto 16px auto; width: 48px; height: 48px; font-size: 1.4rem;">
        <i class="fa-solid fa-leaf"></i>
      </div>
      <h2 style="font-size: 1.6rem; margin-bottom: 6px;">Welcome Back</h2>
      <p style="color: var(--text-muted); font-size: 0.9rem;">Sign in to log waste reports, join events & earn Eco-Points</p>
    </div>

    <form method="POST" action="{% url 'login' %}">
      {% csrf_token %}
      
      <div class="form-group">
        <label class="form-label" for="id_username"><i class="fa-solid fa-user" style="color: var(--primary-400); margin-right: 6px;"></i> Username</label>
        <input type="text" name="username" id="id_username" class="form-input" required placeholder="Enter username">
      </div>

      <div class="form-group">
        <label class="form-label" for="id_password"><i class="fa-solid fa-lock" style="color: var(--primary-400); margin-right: 6px;"></i> Password</label>
        <input type="password" name="password" id="id_password" class="form-input" required placeholder="Enter your password">
      </div>

      <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 12px;">
        <i class="fa-solid fa-arrow-right-to-bracket"></i> Sign In
      </button>
    </form>

    <div style="text-align: center; margin-top: 24px; padding-top: 20px; border-top: 1px solid var(--border-subtle); font-size: 0.9rem; color: var(--text-muted);">
      Don't have an account yet? 
      <a href="{% url 'register' %}" style="font-weight: 600; color: var(--primary-400);">Join GreenCampus</a>
    </div>
  </div>
</div>
{% endblock %}
